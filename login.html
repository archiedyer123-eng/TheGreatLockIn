<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - LOCK IN CHECKLIST</title>

<!-- Banner font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Aptos Mono', monospace;
        background: #40434E;
        background-size: 111%;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        transition: background-image 0.5s ease;
        position: relative;
        overflow: hidden;
    }

    /* BANNER with glow */
    .top-banner {
        width: 100%;
        text-align: center;
        padding: 28px 0;
        font-size: 48px;
        font-weight: 900;
        color: #fffb9a;
        letter-spacing: 6px;
        font-family: 'Orbitron', sans-serif;
        position: absolute;
        top: 35px;
        left: 0;
        z-index: 10;
        text-shadow:
            0 0 4px #ffea62,
            0 0 8px #ffe346,
            0 0 20px #ffda33,
            0 0 32px #ffd400,
            0 0 48px #ffcc00,
            0 0 6px #ffcc00;
    }

    /* Much more visible, patchy smoke behind the title */
.top-banner::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 180%;
    height: 260%;

    background:
        radial-gradient(circle at 22% 20%,
            rgba(255, 255, 255, 0.22) 0%,
            rgba(255, 255, 255, 0.12) 24%,
            transparent 60%),
        radial-gradient(circle at 78% 25%,
            rgba(240, 240, 240, 0.2) 0%,
            rgba(240, 240, 240, 0.11) 26%,
            transparent 62%),
        radial-gradient(circle at 65% 80%,
            rgba(235, 235, 235, 0.19) 0%,
            rgba(235, 235, 235, 0.1) 24%,
            transparent 60%),
        radial-gradient(circle at 30% 72%,
            rgba(245, 245, 245, 0.2) 0%,
            rgba(245, 245, 245, 0.11) 22%,
            transparent 55%),
        radial-gradient(circle at 50% 50%,
            rgba(255, 255, 255, 0.17) 0%,
            rgba(255, 255, 255, 0.09) 22%,
            transparent 52%);

    opacity: 0.42;
    filter: blur(18px);
    z-index: -1;
    pointer-events: none;

    animation: smokeDrift 16s infinite ease-in-out;
}

@keyframes smokeDrift {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.28; }
    20%  { transform: translate(-48%, -53%) scale(1.05); opacity: 0.45; }
    40%  { transform: translate(-53%, -48%) scale(1.08); opacity: 0.6;  }
    60%  { transform: translate(-49%, -46%) scale(1.04); opacity: 0.4;  }
    80%  { transform: translate(-52%, -54%) scale(1.06); opacity: 0.32; }
    100% { transform: translate(-50%, -50%) scale(1.02); opacity: 0.38; }
}

    /* Underline aura */
    .top-banner::after {
        content: "";
        display: block;
        width: 40%;
        max-width: 700px;
        height: 3px;
        margin: 10px auto 0;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 230, 150, 0.95), rgba(255, 200, 0, 0.0));
        box-shadow:
            0 0 16px rgba(255, 230, 150, 0.9),
            0 0 32px rgba(255, 210, 80, 0.7);
    }

    /* LOGIN BOX */
    .login-box {
        background: rgba(255, 255, 255, 0.6);
        padding: 10px 22px;
        border-radius: 15px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.25);
        width: 52%;
        max-width: 330px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        position: relative;
        margin-top: 140px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
        font-weight: bold;
        font-size: 18px;
        white-space: nowrap;
    }

    .background-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 5;
    }

    .bg-button {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 15px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 11px;
        font-family: 'Aptos Mono', monospace;
        transition: all 0.25s ease;
        min-width: 60px;
        color: #f8f8f8;
    }

    .bg-button:hover {
        background: rgba(0, 0, 0, 0.6);
        transform: translateY(-1px) scale(1.03);
    }

    .bg-button.active {
        background: rgba(255, 204, 0, 0.9);
        color: #222;
        border-color: rgba(255, 236, 179, 0.9);
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid rgba(204, 204, 204, 0.8);
        background: rgba(255, 255, 255, 0.95);
        box-sizing: border-box;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #ffcc33;
        box-shadow: 0 0 0 2px rgba(255, 204, 51, 0.25);
        background: rgba(255, 255, 255, 1);
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #222;
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease, color 0.25s ease;
        box-sizing: border-box;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    button:hover {
        background-color: #ffcc33;
        color: #222;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    /* Google button variant */
    .google-btn {
        background-color: #fff;
        color: #444;
        border: 1px solid rgba(0,0,0,0.15);
        text-transform: none;
        letter-spacing: 0.3px;
        font-size: 14px;
    }
    .google-btn:hover {
        background-color: #f1f1f1;
        color: #222;
    }

    .divider {
        text-align: center;
        color: #555;
        font-size: 12px;
        margin: 14px 0 6px;
        letter-spacing: 1px;
    }

    p {
        text-align: center;
        margin-top: 15px;
        color: #333;
    }

    a {
        color: #333;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.2s ease;
    }

    a:hover {
        color: #ffcc33;
        text-decoration: underline;
    }

    #signup {
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="top-banner">THE GREAT LOCK IN</div>

<div class="login-box">
    <input type="email" id="username" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div class="divider">— or —</div>
    <button class="google-btn" onclick="loginWithGoogle()">Continue with Google</button>

    <p>New here? <a href="#" onclick="showSignup()">Sign Up</a></p>

    <div id="signup" style="display:none;">
        <h2>Sign Up</h2>
        <input type="email" id="new-username" placeholder="Email">
        <input type="password" id="new-password" placeholder="Password (min 6 chars)">
        <button onclick="signup()">Create Account</button>
        <p>or <a href="#" onclick="showLogin()">Login</a></p>
    </div>
</div>

<div class="background-controls">
    <button class="bg-button active" onclick="changeBackground(0)">Standard</button>
    <button class="bg-button" onclick="changeBackground(1)">Summer</button>
    <button class="bg-button" onclick="changeBackground(2)">Winter</button>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<!-- Shared init: provides `db` and `auth` -->
<script src="firebase-app.js"></script>

<script>
// db and auth come from firebase-app.js

const backgrounds = [
    'Screenshot 2025-08-14 192943_imgupscaler.ai_General_4K.jpg',
    'Screenshot 2025-08-14 192943_imgupscaler.ai_General_4K.jpg',
    'Screenshot 2025-08-14 192943_imgupscaler.ai_General_4K.jpg'
];

let currentBgIndex = parseInt(localStorage.getItem('globalBackgroundIndex')) || 0;

function changeBackground(index) {
    currentBgIndex = index;
    document.body.style.backgroundImage = `url('${backgrounds[index]}')`;
    localStorage.setItem('globalBackgroundIndex', index);
    document.querySelectorAll('.bg-button').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
}

function initializeBackground() {
    changeBackground(currentBgIndex);
}

// If already signed in, skip the login screen
auth.onAuthStateChanged((user) => {
    if (user) {
        window.location.href = 'index.html';
    }
});

function showSignup() {
    document.getElementById('signup').style.display = 'block';
    document.getElementById('username').style.display = 'none';
    document.getElementById('password').style.display = 'none';
    document.querySelector('button[onclick="login()"]').style.display = 'none';
    document.querySelector('.google-btn').style.display = 'none';
    document.querySelector('.divider').style.display = 'none';
    document.querySelector('.login-box > p').style.display = 'none';
}

function showLogin() {
    document.getElementById('signup').style.display = 'none';
    document.getElementById('username').style.display = 'block';
    document.getElementById('password').style.display = 'block';
    document.querySelector('button[onclick="login()"]').style.display = 'block';
    document.querySelector('.google-btn').style.display = 'block';
    document.querySelector('.divider').style.display = 'block';
    document.querySelector('.login-box > p').style.display = 'block';
}

async function signup() {
    const email = document.getElementById('new-username').value.trim();
    const pass = document.getElementById('new-password').value;

    if (!email || !pass) {
        alert('Fill both fields');
        return;
    }

    try {
        // Creating an account also signs the user in automatically.
        await auth.createUserWithEmailAndPassword(email, pass);
        // onAuthStateChanged above will redirect to index.html
    } catch (err) {
        alert('Signup error: ' + err.message);
    }
}

async function login() {
    const email = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!email || !pass) {
        alert('Fill both fields');
        return;
    }

    try {
        await auth.signInWithEmailAndPassword(email, pass);
        // onAuthStateChanged above will redirect to index.html
    } catch (err) {
        alert('Login error: ' + err.message);
    }
}

async function loginWithGoogle() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        // onAuthStateChanged above will redirect to index.html
    } catch (err) {
        alert('Google sign-in error: ' + err.message);
    }
}

window.addEventListener('load', function() {
    document.getElementById('username').focus();
    initializeBackground();
});

document.getElementById('username').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') document.getElementById('password').focus();
});

document.getElementById('password').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') login();
});

document.getElementById('new-username').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') document.getElementById('new-password').focus();
});

document.getElementById('new-password').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') signup();
});
</script>
</body>
</html>
